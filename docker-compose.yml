services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    labels:
      - traefik.enable=true
      - traefik.http.routers.lime-website.rule=Host(`limedigitalinstitute.org`)
      - traefik.http.routers.lime-website.entrypoints=websecure
      - traefik.http.routers.lime-website.tls.certresolver=letsencrypt
      - traefik.http.services.lime-website.loadbalancer.server.port=80
    volumes:
      - lime-data:/var/www/html/data
      - lime-uploads:/var/www/html/assets/uploads

  landing:
    build:
      context: .
      dockerfile: Dockerfile.landing
    restart: unless-stopped
    ports:
      - "80"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    labels:
      - traefik.enable=true
      - traefik.http.routers.lime-landing.rule=Host(`courses.limedigitalinstitute.org`)
      - traefik.http.routers.lime-landing.entrypoints=websecure
      - traefik.http.routers.lime-landing.tls.certresolver=letsencrypt
      - traefik.http.services.lime-landing.loadbalancer.server.port=80
    volumes:
      - lime-data:/var/www/html/data
      - lime-uploads:/var/www/html/assets/uploads

volumes:
  lime-data:
  lime-uploads:
