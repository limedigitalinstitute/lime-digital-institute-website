services:
  review:
    image: node:20-alpine
    restart: unless-stopped
    ports:
      - "3000"
    environment:
      PORT: "3000"
      ADMIN_PASSWORD: "lime-admin"
      GOOGLE_PLACES_API_KEY: "AIzaSyCTdAV-mDVmsTsquEYwq3u_XdgYY2ideFE"
      GOOGLE_PLACE_ID: "ChIJA7lcgRLLWTkRUW5dToBEQ28"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lime-review.rule=Host(`review.limedigitalinstitute.org`)"
      - "traefik.http.routers.lime-review.entrypoints=websecure"
      - "traefik.http.routers.lime-review.tls.certresolver=letsencrypt"
      - "traefik.http.services.lime-review.loadbalancer.server.port=3000"
    volumes:
      - review-data:/app/persist
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /app/persist /app/public
        cd /app
        echo "" | base64 -d | tar -xz
        node -e "const https = require('https'), fs = require('fs'); const file = fs.createWriteStream('/app/public/logo.png'); https.get('https://raw.githubusercontent.com/limedigitalinstitute/lime-digital-institute-website/main/lime-review-logo.png', res => { res.pipe(file); file.on('finish', () => { file.close(); process.exit(0); }); }).on('error', () => process.exit(0));"
        if [ ! -f /app/persist/data.json ]; then cp /app/data.json /app/persist/data.json; fi
        DATA_FILE=/app/persist/data.json exec node server.js
volumes:
  review-data:
